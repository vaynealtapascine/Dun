[package]
name = "dun"
description = "Dun: reminders and timers that nag until they're done"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The cdylib is what Android loads (System.loadLibrary("dun_lib")); JNI exports
# used by the background receiver must live in this crate.
name = "dun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
dun-core.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
rusqlite.workspace = true
tauri = { version = "~2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dun-android = { path = "../plugins/tauri-plugin-dun-android" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
sha2 = "0.10"
tauri-plugin-single-instance = "~2.4.4"
tauri-plugin-autostart = "~2.5.1"
tauri-plugin-global-shortcut = "~2.3.2"
tauri-plugin-dialog = "~2.7.3"
dun-sync.workspace = true
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
# 0.61 matches Tauri's own windows dependency, so only one copy is built.
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Notifications",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[target.'cfg(target_os = "android")'.dependencies]
# Same version Tauri uses, so only one copy is built.
jni = "0.21"
