[package]
name = "dun"
description = "Dun: reminders and timers that nag until they're done"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The cdylib is what Android loads (System.loadLibrary("dun_lib")); JNI exports
# used by the background receiver must live in this crate.
name = "dun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6.3", features = [] }

[dependencies]
dun-core.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
rusqlite.workspace = true
tauri = { version = "~2.11.5", features = [] }
tauri-plugin-dun-android = { path = "../plugins/tauri-plugin-dun-android" }

[target.'cfg(windows)'.dependencies]
# 0.61 matches Tauri's own windows dependency, so only one copy is built.
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Notifications",
] }
windows-core = "0.61"

[target.'cfg(target_os = "android")'.dependencies]
# Same version Tauri uses, so only one copy is built.
jni = "0.21"
