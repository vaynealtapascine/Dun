[workspace]
resolver = "2"
members = ["crates/dun-core", "crates/dun-sync", "src-tauri", "plugins/tauri-plugin-dun-android"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
dun-core = { path = "crates/dun-core" }
dun-sync = { path = "crates/dun-sync", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
jiff = { version = "0.2.37", features = ["serde"] }
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
proptest = "1.11"

[profile.release]
codegen-units = 1
lto = true
strip = true
