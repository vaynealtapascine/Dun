<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0604F"/>
      <stop offset="1" stop-color="#D23B32"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- ring with a gap at the top, like a timer that has run out -->
  <path d="M 452 222 A 300 300 0 1 0 572 222" fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round"/>
  <!-- tick at the top of the ring -->
  <line x1="512" y1="180" x2="512" y2="262" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round"/>
  <!-- check mark -->
  <path d="M 372 526 L 472 626 L 664 434" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
